name: Build APK

# Builds a debug APK on every push to master and on pull requests.
# Run it by hand from the "Actions" tab (Run workflow) whenever you want a fresh APK.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels an older build of the same branch.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Installs the Android SDK command-line tools and accepts the licences, so Gradle can
      # download the compile SDK (the project targets a very recent one).
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      # Caches Gradle downloads between runs to make builds faster.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make the Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build the debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: HeadsUp-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
