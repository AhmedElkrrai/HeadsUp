name: Build APK

# Builds a debug APK on every push to master and on pull requests.
# Run it by hand from the "Actions" tab (Run workflow) whenever you want a fresh APK.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to publish the APK as a release

# A newer push cancels an older build of the same branch.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # GitHub's Ubuntu runners already ship the Android SDK ($ANDROID_HOME). We only need to accept
      # its licences so Gradle can download the compile SDK this project targets (a very recent one).
      # "|| true": `yes` is stopped by sdkmanager closing the pipe, which is not a real failure.
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Caches Gradle downloads between runs to make builds faster.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make the Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build the debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: HeadsUp-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # GitHub zips workflow artifacts, so also publish the plain .apk as a release you can download directly:
      # https://github.com/AhmedElkrrai/HeadsUp/releases/download/latest/HeadsUp.apk
      - name: Publish the APK to the "latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk HeadsUp.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest HeadsUp.apk \
            --title "Latest build" \
            --notes "Debug APK built from commit ${GITHUB_SHA::7}. Download HeadsUp.apk below." \
            --prerelease \
            --target "$GITHUB_SHA"
